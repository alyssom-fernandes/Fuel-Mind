# Roda os testes a cada envio e em cada pull request. Não há dependência a
# instalar: o `node --test` vem com o Node, e os testes carregam os arquivos
# de src/ direto, como o navegador.
name: Testes

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: node --test
        run: node --test tests/*.test.js
