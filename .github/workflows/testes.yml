# Roda os testes a cada envio e em cada pull request. Os testes de unidade
# não têm dependência a instalar: o `node --test` vem com o Node, e os
# testes carregam os arquivos de src/ direto, como o navegador.
#
# As regras do Firestore são testadas no emulador, com o projeto
# demo-fuelmind, que não existe na nuvem: nada sai da máquina do CI. O
# emulador precisa do Java 21; o firebase-tools vai com a versão fixa.
name: Testes

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: node --test
        run: node --test tests/*.test.js

  regras:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Regras do Firestore no emulador
        run: npx --yes firebase-tools@15.19.1 emulators:exec --only firestore --project demo-fuelmind "node --test tests/regras/*.test.js"
