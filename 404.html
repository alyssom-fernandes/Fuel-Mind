<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Página não encontrada | Fuel Mind</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@700&family=DM+Sans:wght@400;600&display=swap">
  <!-- Página própria no lugar da 404 padrão do Firebase, que era em inglês
       e não tinha nada do sistema (18/09/2026). Segue o tema escolhido no
       sistema (localStorage "tema") e, sem ele, o do aparelho. -->
  <style>
    :root { --bg: #0a0a0a; --cartao: #151515; --borda: #333; --texto: #f5f5f5; --fraco: #aaa; --primaria: #a02828; }
    :root[data-theme="light"] { --bg: #f8f9fa; --cartao: #ffffff; --borda: #dee2e6; --texto: #212529; --fraco: #6c757d; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px;
      background: radial-gradient(70% 55% at 50% -10%, rgba(160,40,40,0.15), transparent 70%), var(--bg);
      color: var(--texto); font-family: 'DM Sans', system-ui, sans-serif;
    }
    main {
      width: min(440px, 100%); padding: 40px 32px 32px; text-align: center;
      background: var(--cartao); border: 1px solid var(--borda); border-radius: 20px;
      box-shadow: 0 16px 48px rgba(0,0,0,0.25);
    }
    img { width: 180px; height: auto; margin-bottom: 28px; }
    .codigo { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 3rem; line-height: 1; color: var(--primaria); margin: 0 0 8px; }
    h1 { font-family: 'Syne', sans-serif; font-size: 1.3rem; margin: 0 0 10px; }
    p { color: var(--fraco); margin: 0 0 28px; line-height: 1.5; font-size: 0.95rem; }
    a {
      display: inline-block; padding: 12px 22px; border-radius: 8px; text-decoration: none;
      background: var(--primaria); color: #fff; font-weight: 600; font-size: 0.95rem;
    }
    a:hover, a:focus-visible { filter: brightness(0.9); }
  </style>
  <script>
    (function () {
      var tema = null;
      try { tema = localStorage.getItem("tema"); } catch (e) {}
      if (!tema) tema = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", tema);
    })();
  </script>
</head>
<body>
  <main>
    <img id="logo" src="/assets/logo-dark.svg" alt="Fuel Mind" width="1199" height="291">
    <p class="codigo">404</p>
    <h1>Página não encontrada</h1>
    <p>O endereço não existe ou mudou. As notas, os relatórios e os fretes continuam no mesmo lugar.</p>
    <a href="/">Ir para o Fuel Mind</a>
  </main>
  <script>
    if (document.documentElement.getAttribute("data-theme") === "light") document.getElementById("logo").src = "/assets/logo-light.svg";
  </script>
</body>
</html>
